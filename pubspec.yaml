name: carton_boom
description: Plataforma integral Cartón Boom - CRM, Cotizador, ERP de planta, Inventarios y Analítica.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  go_router: ^16.0.0
  fl_chart: ^1.0.0
  pdf: ^3.11.3
  printing: ^5.14.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  table_calendar: ^3.2.0
  file_picker: ^10.0.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/seed.json
    - assets/logo/